<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareLedger Sign Out</title>
  <meta name="theme-color" content="#0b2350" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="CareLedger" />
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png" />
  <link rel="icon" type="image/svg+xml" href="../icon.svg" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lexend:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #eaf1fb;
      --panel: #ffffff;
      --teal: #0e63d6;
      --teal-deep: #0b2350;
      --line: #dfe7f3;
      --muted: #5b6b85;
      --text: #0f1f3d;
      --shadow: 0 18px 44px rgba(15, 31, 61, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: radial-gradient(circle at top, #f6f9fe 0%, var(--bg) 48%, #e3ecf9 100%);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .logout-card {
      width: min(440px, 100%);
      padding: 40px 36px 34px;
      background: var(--panel);
      border: 1px solid rgba(120, 145, 190, 0.22);
      border-radius: 28px;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .check {
      width: 60px;
      height: 60px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--teal-deep) 0%, var(--teal) 100%);
      color: #fff;
      font-size: 28px;
      font-weight: 800;
    }
    .eyebrow {
      color: var(--muted);
      font: 500 11px 'Inter', sans-serif;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1 {
      margin: 10px 0 10px;
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: -0.04em;
    }
    p {
      margin: 0 auto 28px;
      max-width: 30ch;
      color: var(--muted);
      line-height: 1.6;
    }
    .primary-button {
      display: block;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--teal) 0%, #2f8cff 100%);
      color: #fff;
      padding: 15px 18px;
      font: 800 15px 'Inter', sans-serif;
      text-decoration: none;
      box-shadow: 0 10px 20px rgba(14,99,214,.24);
    }
    .note {
      margin: 18px auto 0;
      font-size: 12px;
    }
    h1, h2 { font-family: 'Lexend', 'Inter', sans-serif; font-weight: 700; letter-spacing: -0.03em; }
  </style>
</head>
<body>
  <main class="logout-card">
    <div class="check">✓</div>
    <span class="eyebrow">CareLedger</span>
    <h1>You're signed out</h1>
    <p>Your clinic ledger is still saved on this device. Sign in again to keep working.</p>
    <a class="primary-button" href="../login/">Sign in again</a>
    <p class="note" id="signedOutAt"></p>
  </main>

  <script>
    localStorage.removeItem('careledger-auth');
    document.getElementById('signedOutAt').textContent = `Signed out at ${new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
  </script>
</body>
</html>
